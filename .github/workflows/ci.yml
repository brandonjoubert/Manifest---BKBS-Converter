name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q
        env:
          # Tests must not require a live API key
          XAI_API_KEY: ""
          LLM_API_KEY: ""
          BKBS_ALLOW_PRIVATE_URLS: "1"

      - name: Stage 0 export baseline (Python)
        run: python scripts/verify_exports.py --edition python
        env:
          XAI_API_KEY: ""
          LLM_API_KEY: ""

      - name: Claim Ledger Stage 1 contract
        run: python scripts/stage1_contract_check.py
        env:
          XAI_API_KEY: ""
          LLM_API_KEY: ""

      - name: Claim Ledger Stage 2 export-via-resolve (Python)
        run: python scripts/verify_exports_via_resolve.py --edition python
        env:
          XAI_API_KEY: ""
          LLM_API_KEY: ""

      - name: Claim Ledger Stage 4b adapter contract
        run: python scripts/stage4b_contract_check.py
        env:
          XAI_API_KEY: ""
          LLM_API_KEY: ""

      - name: Claim Ledger Stage 4c artifacts contract
        run: python scripts/stage4c_contract_check.py
        env:
          XAI_API_KEY: ""
          LLM_API_KEY: ""

      - name: Set up PHP (Stage 8 contract, all editions)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Claim Ledger Stage 8 findings contract
        run: python scripts/stage8_contract_check.py
        env:
          XAI_API_KEY: ""
          LLM_API_KEY: ""

  php-syntax:
    name: PHP syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, curl, json, mbstring
          coverage: none

      - name: Lint PHP sources
        run: |
          set -e
          find php -name '*.php' -print0 | while IFS= read -r -d '' f; do
            php -l "$f"
          done

      - name: Stage 0 export baseline (PHP)
        run: php php/scripts/verify_exports.php

      - name: Claim Ledger Stage 2 export-via-resolve (PHP)
        run: php php/scripts/verify_exports_via_resolve.php

      - name: Claim Ledger Stage 4a publication rule (PHP)
        run: php php/scripts/verify_stage4a.php

      - name: Claim Ledger Stage 4c artifacts (PHP)
        run: php php/scripts/verify_stage4c.php

      - name: Claim Ledger Stage 6 envelope (PHP)
        run: php php/scripts/verify_stage6.php

      - name: Claim Ledger Stage 7 query API (PHP)
        run: php php/scripts/verify_stage7.php

      - name: Claim Ledger Stage 8 origin audit (PHP)
        run: php php/scripts/verify_stage8.php

      - name: Claim Ledger Stage 8 origin audit (WP extract)
        run: php php/scripts/verify_stage8_wp.php

      - name: PHP Resolver + backfill lint (Stage 2)
        run: |
          php -l php/src/Resolver.php
          php -l php/scripts/backfill_claims.php
          php -l php/scripts/verify_exports_via_resolve.php
          php -l php/scripts/verify_stage4a.php
          php -l php/src/Exports/LlmsTxt.php
          php -l php/src/Exports/SchemaOrg.php
          php -l php/src/Exports/GraphJson.php
          php -l php/src/Exports/AgentJson.php
          php -l php/src/Exports/Robots.php
          php -l php/src/Exports/JsonLdSnippet.php
          php -l php/scripts/verify_stage4c.php
          php -l php/scripts/verify_stage6.php
          php -l php/scripts/verify_stage7.php
          php -l php/src/ScanAudit.php
          php -l php/scripts/verify_stage8.php
          php -l php/scripts/verify_stage8_wp.php
          php -l php/templates/scan.php
          php -l wordpress-plugin/manifest-bkbs-converter/includes/class-mbkbs-query-api.php
          php -l wordpress-plugin/manifest-bkbs-converter/includes/class-mbkbs-scan-audit.php
          php -l wordpress-plugin/manifest-bkbs-converter/admin/views/scan.php

  package-php-zip:
    name: PHP zip present
    runs-on: ubuntu-latest
    needs: [php-syntax]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify installer zip exists
        run: |
          test -f installers/php-host/bkbs-php-edition.zip
          unzip -t installers/php-host/bkbs-php-edition.zip

  package-wp-zip:
    name: WP zip present
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify WordPress plugin zip exists
        run: |
          test -f wordpress-plugin/manifest-bkbs-converter.zip
          unzip -t wordpress-plugin/manifest-bkbs-converter.zip
